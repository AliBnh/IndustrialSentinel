services:
  mlflow:
    image: python:3.11-slim
    container_name: industrial-sentinel-mlflow
    command: >
      bash -c "pip install mlflow --quiet &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: on-failure

  training:
    build:
      context: .
      dockerfile: docker/training.Dockerfile
    container_name: industrial-sentinel-training
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DATA_DIR=/app/data
      - MODEL_DIR=/app/models
      - PROJECT_ROOT=/app
    volumes:
      - model_artifacts:/app/models
      - ./data:/app/data
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: industrial-sentinel-api
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
      - MODEL_DIR=/app/models
      - PROJECT_ROOT=/app
    volumes:
      - model_artifacts:/app/models
      - ./data:/app/data
    depends_on:
      training:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    container_name: industrial-sentinel-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - DATA_DIR=/app/data
      - MODEL_DIR=/app/models
    volumes:
      - model_artifacts:/app/models
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

volumes:
  model_artifacts:
  mlflow_data:
